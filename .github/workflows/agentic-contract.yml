name: agentic-contract

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Validate runtime policy
        run: |
          python3 - <<'PY'
          import json, tomllib

          with open(".claude/settings.json", encoding="utf-8") as f:
              claude = json.load(f)
          assert claude.get("ultracode") is True

          with open(".agentic/agentic.json", encoding="utf-8") as f:
              agentic = json.load(f)
          assert agentic["schemaVersion"] == 4
          assert agentic["orchestration"] == "runtime-native"

          with open(".codex/config.toml", "rb") as f:
              codex = tomllib.load(f)
          assert codex["model_reasoning_effort"] == "ultra"
          assert codex["agents"]["enabled"] is True
          PY
      - run: bash -n scripts/*.sh
      - name: Check required files
        run: |
          test -f CLAUDE.md
          test -f AGENTS.md
          test -f .agentic/PROJECT.md
          test -f .claude/settings.json
          test -f .codex/config.toml
          test -f .github/dependabot.yml
